# Патч-слой пакета «Учётная запись Token Seller».
#
# Файл ставит ровно одну строку — сам этот пакет. Слой ничего не выключает:
# строк `disabled: true` здесь нет и быть не должно. Штатные строки харнесса
# (`llm-deepseek`, `ui-brand-official` и подобные) не трогаются. В частности,
# штатный маршрут моделей DeepSeek остаётся включённым: маршрут Token Seller
# панель дописывает рядом, отдельными пространствами `llm-pi-ai` и
# `agent-default-model`, а не вместо них.
#
# Имя строки — имя пакета, а НЕ относительный путь вроде `./lib/index.js`.
#
# Это не стилистика, а требование: от имени строки зависит название плагина в
# разделе «Настройки → Модули». Харнесс читает описание пакета только для
# «голого» имени (`barePackageName` в `@deepseek-ai/dsh-app-boot`). Относительный
# путь харнесс сам переписывает в `file://`-адрес (`anchorInsertedPluginNames`),
# а адрес содержит двоеточие — и проверка тоже его отбрасывает. В обоих случаях
# метаданные не читаются, и в списке плагинов вместо названия показывается сам
# путь. Подробный разбор — в `docs/ИМЯ_ПЛАГИНА_В_НАСТРОЙКАХ.md` репозитория
# fedot-modules.
#
# Название берётся из `locale/ru.json` этого пакета (`meta.title`); рядом лежит
# `locale/en.json` — запасной вариант для английского интерфейса. Чтобы локаль
# была видна, в `package.json` объявлена строка exports
# `"./locale/*.json": "./locale/*.json"`.
#
# Имя пакета разрешается из профиля: пакет лежит в его `node_modules`, поэтому
# отдельной правки путей не требует.
#
# Адрес сервиса — настройка строки. По умолчанию боевой домен `федота.рф`
# (в punycode `xn--80ahc1bui.xn--p1ai`). Переменная окружения
# `TOKEN_SELLER_BASE_URL` позволяет подменить адрес на стенд при отладке.
#
# Пустой слой пишется как []: YAML-файл без верхнеуровневого массива харнесс
# отвергает.
- insert:
    - id: fedot-token-seller-account
      name: '@fedot/token-seller-account'
      config:
        baseUrl: !!js process.env.TOKEN_SELLER_BASE_URL ?? 'https://xn--80ahc1bui.xn--p1ai'
