# Патч-слой пакета «Учётная запись Token Seller».
#
# Файл ставит две строки: сам этот пакет и маршрут моделей Token Seller в
# штатном слое `llm-pi-ai`. Слой ничего не выключает: строк `disabled: true`
# здесь нет и быть не должно. Штатный маршрут DeepSeek (`llm-deepseek`,
# `llm-deepseek-account`) не трогается — он остаётся отдельным провайдером.
#
# ПОЧЕМУ МАРШРУТ ЗДЕСЬ, А НЕ В НАСТРОЙКАХ.
#
# Этот файл применяется при старте профиля, до любой записи настроек, поэтому
# маршрут появляется у человека сразу после установки архива — ещё до входа.
# Раньше маршрут дописывала панель через `settings.mutate`, и вход зависел от
# того, согласится ли харнесс принять запись настроек. Не согласится — вход
# падал, хотя ключ уже сохранён, а провайдер не появлялся. На чужом компьютере
# ученика такое не воспроизвести и не объяснить.
#
# Теперь от входа зависит только ключ: он один и меняется от входа к входу.
# Маршрут неизменен (адрес, две модели, лимиты, согласование запроса) и потому
# живёт здесь, рядом с кодом, который его обслуживает.
#
# Имя строки — имя пакета, а НЕ относительный путь вроде `./lib/index.js`.
#
# Это не стилистика, а требование: от имени строки зависит название плагина в
# разделе «Настройки → Модули». Харнесс читает описание пакета только для
# «голого» имени (`barePackageName` в `@deepseek-ai/dsh-app-boot`). Относительный
# путь харнесс сам переписывает в `file://`-адрес (`anchorInsertedPluginNames`),
# а адрес содержит двоеточие — и проверка тоже его отбрасывает. В обоих случаях
# метаданные не читаются, и в списке плагинов вместо названия показывается сам
# путь. Подробный разбор — в `docs/ИМЯ_ПЛАГИНА_В_НАСТРОЙКАХ.md` репозитория
# fedot-modules.
#
# Имя строки маршрута — `llm-pi-ai`: так пишется штатная строка харнесса, и
# правка слоя добавляет ей поле `providers`, не заменяя саму строку.
#
# Адрес сервиса — настройка строки пакета. По умолчанию боевой домен `федота.рф`
# (в punycode `xn--80ahc1bui.xn--p1ai`). Переменная окружения
# `TOKEN_SELLER_BASE_URL` позволяет подменить адрес на стенд при отладке.
#
# Адрес маршрута берётся из той же переменной и обязан совпадать: ключ, выданный
# стендом, не примут на боевом домене. Суффикс `/v1` дописывается здесь же.
#
# Пустой слой пишется как []: YAML-файл без верхнеуровневого массива харнесс
# отвергает.
- insert:
    - id: fedot-token-seller-account
      name: '@fedot/token-seller-account'
      config:
        baseUrl: !!js process.env.TOKEN_SELLER_BASE_URL ?? 'https://xn--80ahc1bui.xn--p1ai'

# Маршрут моделей Token Seller. OpenAI-совместимый протокол, две модели сервиса.
#
# Лимиты (окно 1 млн, ответ до 384 тыс.) каталог харнесса для этих моделей не
# описывает, поэтому без чисел он берёт штатные 262 144 и 32 768: кольцо
# контекста врёт вдвое, а ответ обрезается раньше, чем кончается окно модели.
#
# `compat`: системное сообщение уходит ролью `system` (`developer` сервис не
# принимает), уровень рассуждений уходит полем `reasoning_effort` вместе с
# `thinking` — это формат DeepSeek. Уровень `off` значит «ничего не отправлять»,
# и он задаёт точку отсчёта, а не запрет: любой объявленный уровень человек
# может выбрать в списке моделей.
#
# Уровень по умолчанию — `off`. Без него список рисует первым отдельный пункт
# «По умолчанию», а нам он не нужен: выключенный уровень и так означает «ничего
# не отправлять» и стоит первым. С `reasoning: off` список идёт по возрастанию:
# выключен, низкий, высокий, максимальный, и тот же `off` подставлен по
# умолчанию. Запрос от этого не меняется: `off` переводится в отсутствие
# `reasoning_effort`, как и раньше.
#
# `input`: без него `llm-pi-ai` считает модель текстовой и отказывает картинке
# ещё до отправки — «модель не поддерживает изображение». Обе модели сервиса
# картинки принимают (клиент их уже присылал напрямую, и они читались), поэтому
# на вход объявлены и текст, и картинка. Проверка на стороне харнесса до
# отправки — единственное, что могло отклонить картинку: сам сервис тело запроса
# не разбирает по кускам и отдаёт провайдеру как есть.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      token-seller:
        apiKeyEnv: TOKEN_SELLER_API_KEY
        displayName: Token Seller
        api: openai-completions
        baseURL: !!js (process.env.TOKEN_SELLER_BASE_URL ?? 'https://xn--80ahc1bui.xn--p1ai').replace(/\/+$/u, '').replace(/\/v1$/u, '') + '/v1'
        reasoning: off
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          thinkingFormat: deepseek
        models:
          - id: deepseek-flash
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              low: low
              high: high
              max: max
          - id: deepseek-v4-pro
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              high: high
              max: max
